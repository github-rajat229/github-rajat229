name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: github-rajat229
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: UTC
          config_theme: dark
          
          # 3D Isometric Contributions Calendar (Top Right)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # PageSpeed Insights Scores (Top Right)
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://github.com
          
          # Coding Habits Bar Charts (Middle)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Most Used Languages & Progress Bar (Bottom Right)
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          
          # Mastered Technologies Icons (Bottom Left)
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 20
          
          # Projects Section
          plugin_projects: yes
          plugin_projects_limit: 2
